{% extends 'base.html' %}

{% block title %}Tutorials - CroSho{% endblock %}

{% block content %}
<style>
    .tutorial-card {
        background-color: var(--bg-color);
        border: 1px solid var(--accent-color);
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 1rem;
    }
    .tutorial-card h3 {
        font-family: 'Croissant One', serif;
        color: var(--tip-heading);
        margin: 0.5rem 0;
    }
    .tutorial-card p {
        color: var(--text-color);
        font-size: 0.9rem;
    }
    .tutorial-card a {
        background-color: var(--accent-color);
        color: var(--navbar-text);
        padding: 0.5rem 1rem;
        border-radius: 5px;
        text-decoration: none;
        display: inline-block;
        margin-top: 0.5rem;
        transition: background-color 0.3s ease;
    }
    .tutorial-card a:hover {
        background-color: var(--secondary-accent);
    }
    .yarn-ball-icon::before {
        content: '🧶';
        margin-right: 0.3rem;
    }
</style>

<div class="container">
    <h2 class="text-center mb-4">Crochet Tutorials</h2>
    <div class="row">
        {% for tutorial in tutorials %}
        <div class="col-md-6">
            <div class="tutorial-card">
                <h3>{{ tutorial.title }}</h3>
                <p>{{ tutorial.description }}</p>
                <a href="#" class="yarn-ball-icon">Watch Tutorial</a>
            </div>
        </div>
        {% empty %}
        <p class="text-center">No tutorials available at the moment.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
