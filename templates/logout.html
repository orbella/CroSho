{% extends 'base.html' %}
{% load static %}
{% block title %}Logged Out{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-lg border-0 floral-card text-center">
            <div class="card-body">
                <h2 class="mb-4">See You Soon!</h2>
                <p class="lead text-muted mb-4">{{ message }}</p>
                <p class="text-muted">Miss us already? <a href="{% url 'login' %}" style="color: #A3D4D5; font-weight: 600;">Log back in</a> to continue your crochet journey.</p>
                <a href="{% url 'home' %}" class="btn btn-primary mt-3">Return to Home</a>
            </div>
        </div>
    </div>
</div>

<style>
    .floral-card {
        background-color: #FFF9F5;
        border-radius: 15px;
        position: relative;
        overflow: hidden;
        padding: 2rem;
    }

    .floral-card::before {
        content: '';
        position: absolute;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;
        background: url('{% static "floral-pattern.png" %}') repeat;
        opacity: 0.2;
        z-index: -1;
    }

    .btn-primary {
        font-weight: 600;
        transition: transform 0.3s ease;
    }

    .btn-primary:hover {
        transform: scale(1.05);
    }

    @media (max-width: 768px) {
        .floral-card {
            padding: 1.5rem;
        }
        h2 {
            font-size: 1.8rem;
        }
        .lead {
            font-size: 1rem;
        }
    }
</style>

<script>
    // Add a subtle bounce animation on button click
    document.querySelector('.btn-primary').addEventListener('click', function() {
        this.style.animation = 'bounce 0.5s ease';
    });

    const styleSheet = document.createElement('style');
    styleSheet.innerHTML = `
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    `;
    document.head.appendChild(styleSheet);
</script>
{% endblock %}
